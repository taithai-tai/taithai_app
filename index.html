<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taithai Apps</title>
  <meta name="description" content="A thoughtfully curated collection of useful apps by Taithai." />
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
  <style>
    :root {
      --bg: #FDF6F0;
      --surface: #FFFCF9;
      --peach: #F5C4A8;
      --peach-dark: #C97A52;
      --text: #4A3728;
      --text-mid: #7A5C48;
      --text-muted: #A88B78;
      --text-faint: #CEBCB0;
      --border: #EDD8C8;
      --border-soft: #F5E8DC;
      --accent: #E8896A;
      --accent-light: #FDEEE8;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans Thai', 'Mitr', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    .blob1 {
      width: 480px;
      height: 480px;
      background: #F5C4A8;
      top: -140px;
      right: -100px;
    }

    .blob2 {
      width: 340px;
      height: 340px;
      background: #F2B8B8;
      bottom: 40px;
      left: -100px;
    }

    .blob3 {
      width: 220px;
      height: 220px;
      background: #E8D090;
      top: 45%;
      left: 32%;
    }

    .float-deco {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.1;
      font-size: 30px;
      animation: floatY 7s ease-in-out infinite;
    }

    .float-deco:nth-of-type(1) {
      top: 14%;
      left: 3%;
      animation-delay: 0s;
    }

    .float-deco:nth-of-type(2) {
      top: 58%;
      right: 2%;
      animation-delay: 2.5s;
    }

    .float-deco:nth-of-type(3) {
      bottom: 18%;
      left: 6%;
      animation-delay: 5s;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    header, main, footer {
      position: relative;
      z-index: 1;
    }

    header {
      background: rgba(253, 246, 240, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1.5px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #F5C4A8 0%, #F2B8B8 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(232, 137, 106, 0.28);
    }

    .brand-name {
      font-family: 'Mitr', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }

    .brand-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: 1px;
      vertical-align: middle;
      margin-bottom: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .google-login-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      font-family: inherit;
    }

    .google-login-btn:hover {
      background: #FFFFFF;
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(232, 137, 106, 0.2);
    }

    .google-login-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .user-profile-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px 4px 5px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--peach);
    }

    .user-info-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      max-width: 110px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 10px;
      color: var(--text-muted);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-btn {
      border: none;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }

    .logout-btn:hover {
      background: var(--accent);
      color: white;
    }

    .welcome-user-card {
      background: linear-gradient(135deg, var(--surface) 0%, var(--accent-light) 100%);
      border: 1.5px solid var(--peach);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 18px auto 22px;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      box-shadow: 0 8px 24px rgba(232, 137, 106, 0.12);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-avatar-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
    }

    .welcome-text h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .welcome-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .status-online {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #2D8A45;
      background: rgba(45, 138, 69, 0.08);
      padding: 2px 10px;
      border-radius: 999px;
    }

    .green-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2D8A45;
      display: inline-block;
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-mid);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(232, 137, 106, 0.28);
    }

    .wrapper {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .hero {
      padding: 52px 0 36px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      border: 1.5px solid var(--peach);
      border-radius: 40px;
      padding: 5px 16px;
      font-size: 12px;
      color: var(--peach-dark);
      font-weight: 500;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-family: 'Mitr', sans-serif;
      font-size: clamp(28px, 5.5vw, 44px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .hero h1 .hi {
      color: var(--accent);
      position: relative;
      display: inline-block;
    }

    .hero h1 .hi::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--peach);
      opacity: 0.4;
      border-radius: 4px;
      z-index: -1;
    }

    .hero p {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 620px;
      margin: 0 auto 28px;
      font-weight: 300;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      border-radius: 40px;
      padding: 7px 16px;
      font-size: 13px;
      color: var(--text-mid);
    }

    .stat-num {
      font-family: 'Mitr', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .stat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-faint);
      white-space: nowrap;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border-soft);
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 420px));
      justify-content: center;
      gap: 16px;
      margin-bottom: 56px;
    }

    .app-card {
      background: var(--surface);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 22px 20px 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.22s cubic-bezier(.34,1.4,.64,1), box-shadow 0.22s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: -28px;
      right: -28px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #FDE8E8;
      opacity: 0.55;
      transition: transform 0.3s ease;
    }

    .app-card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 10px 32px rgba(185,110,80,0.13);
      border-color: var(--peach);
    }

    .app-card:hover::before {
      transform: scale(1.7);
    }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: #FDE8E8;
      position: relative;
      z-index: 1;
    }

    .app-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .app-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 300;
    }

    .app-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 40px;
      font-weight: 500;
      margin-top: auto;
      width: fit-content;
      background: #FDE8E8;
      color: #B85050;
    }

    footer {
      border-top: 1.5px solid var(--border-soft);
      padding: 22px 0;
    }

    .footer-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-left,
    .footer-right {
      font-size: 13px;
      color: var(--text-faint);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #FDF6F0;
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 13px;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(.34,1.3,.64,1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 720px) {
      .header-inner {
        padding: 12px 16px;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-end;
        margin-left: 0;
      }
    }

    @media (max-width: 640px) {
      .wrapper {
        padding: 0 16px;
      }

      .hero {
        padding: 36px 0 28px;
      }

      .apps-grid {
        grid-template-columns: 1fr;
      }

      .app-card {
        padding: 16px 14px 14px;
      }

      .app-icon {
        width: 48px;
        height: 48px;
        font-size: 22px;
      }

      .app-name {
        font-size: 14px;
      }
    }

    @media (max-width: 380px) {
      .brand-name {
        display: none;
      }
    }

    /* Apple HIG-inspired refinement: semantic colors, clear hierarchy, adaptive layout. */
    :root {
      color-scheme: light dark;
      --bg: #f7f7f9;
      --surface: rgba(255, 255, 255, 0.84);
      --surface-solid: #fff;
      --text: #1d1d1f;
      --text-mid: #5f6065;
      --text-muted: #65666b;
      --text-faint: #73747a;
      --border: rgba(29, 29, 31, .13);
      --border-soft: rgba(29, 29, 31, .09);
      --accent: #d86445;
      --accent-light: #fff0ea;
      --peach: #efaa91;
      --peach-dark: #ad432b;
      --focus: #0071e3;
      --radius: 24px;
    }

    body {
      background:
        radial-gradient(circle at 88% 8%, rgba(241, 174, 143, .22), transparent 28rem),
        radial-gradient(circle at 5% 54%, rgba(255, 211, 198, .18), transparent 24rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Noto Sans Thai", sans-serif;
      font-size: 17px;
      line-height: 1.5;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .bg-blob, .float-deco { display: none; }

    header {
      border-bottom: 1px solid var(--border-soft);
      background: rgba(247, 247, 249, .78);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    .header-inner { max-width: 1120px; min-height: 68px; padding: 10px 24px; flex-wrap: nowrap; }
    .brand { min-height: 44px; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(145deg, #ffd4c4, #ee9676);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 5px 12px rgba(185,77,50,.16);
    }
    .brand-name { font-family: inherit; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }

    .header-actions { gap: 10px; flex-wrap: nowrap; }
    .google-login-btn, .logout-btn, .lang-btn { min-height: 44px; transition: .18s ease; }
    .google-login-btn {
      min-width: 44px; padding: 0 16px; border: 1px solid var(--border);
      background: var(--surface-solid); color: var(--text); font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .google-login-btn:hover { background: var(--surface-solid); border-color: var(--border); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    .google-login-btn:disabled { cursor: wait; transform: none; }
    .user-profile-bar { min-height: 48px; padding: 3px 4px 3px 5px; border: 1px solid var(--border); background: var(--surface-solid); }
    .user-avatar { width: 36px; height: 36px; border: 0; }
    .user-name { font-size: 13px; font-weight: 650; }
    .user-email { font-size: 11px; color: var(--text-mid); }
    .logout-btn { padding: 0 14px; color: var(--peach-dark); font-size: 13px; font-weight: 650; }
    .lang-switch { padding: 3px; gap: 2px; border: 1px solid var(--border-soft); background: rgba(118,118,128,.10); }
    .lang-btn { min-width: 44px; padding: 0 12px; font-size: 13px; }
    .lang-btn.active { background: var(--surface-solid); color: var(--text); box-shadow: 0 1px 5px rgba(0,0,0,.10); }

    .wrapper { max-width: 1120px; }
    .hero { padding: clamp(72px, 10vw, 124px) 0 42px; }
    .hero-badge { min-height: 32px; margin-bottom: 22px; padding: 5px 13px; border: 1px solid rgba(216,100,69,.20); font-size: 13px; font-weight: 650; }
    .hero h1 { max-width: 820px; margin: 0 auto 20px; font-family: inherit; font-size: clamp(42px, 7vw, 76px); font-weight: 700; letter-spacing: -.055em; line-height: 1.04; }
    .hero h1 .hi::after { display: none; }
    .hero p { max-width: 650px; margin: 0 auto; color: var(--text-mid); font-size: clamp(17px, 2.2vw, 21px); line-height: 1.55; font-weight: 400; }

    .welcome-user-card { max-width: 560px; margin: 0 auto 28px; padding: 12px 14px; border: 1px solid var(--border); background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.05); }
    .welcome-avatar-wrap img { width: 48px; height: 48px; border: 0; }
    .welcome-title { margin-bottom: 1px; color: var(--text); font-size: 16px; font-weight: 650; }
    .welcome-text p { color: var(--text-mid); font-size: 13px; }
    .status-online { color: #16743a; font-size: 12px; }

    .stats-bar { margin: 0 auto 58px; gap: 10px; }
    .stat-pill { min-height: 40px; padding: 7px 14px; border: 1px solid var(--border-soft); background: var(--surface); color: var(--text-mid); font-size: 14px; }
    .stat-num { font-family: inherit; font-size: 15px; font-weight: 700; }
    .section-head { margin-bottom: 20px; align-items: flex-end; }
    .section-label { color: var(--text); font-size: clamp(24px, 3vw, 32px); font-weight: 700; letter-spacing: -.035em; text-transform: none; }
    .section-line { display: none; }

    .apps-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 84px; }
    .app-card { min-height: 260px; padding: 22px; gap: 16px; border: 1px solid var(--border-soft); background: var(--surface); box-shadow: 0 2px 12px rgba(0,0,0,.025); transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
    .app-card::before { display: none; }
    .app-card:hover { transform: translateY(-4px); border-color: var(--border); box-shadow: 0 14px 40px rgba(0,0,0,.07); }
    .app-card:active { transform: scale(.985); }
    .app-icon { width: 58px; height: 58px; border: 1px solid rgba(255,255,255,.7); border-radius: 17px; background: linear-gradient(145deg,#fff7f3,#ffd8c9); box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 8px 20px rgba(185,77,50,.10); font-size: 27px; }
    .app-icon img { width: 100%; height: 100%; display: block; border-radius: inherit; object-fit: cover; }
    .app-name { margin-bottom: 7px; font-size: 18px; font-weight: 700; letter-spacing: -.015em; }
    .app-desc { color: var(--text-mid); font-size: 14px; line-height: 1.55; font-weight: 400; }
    .app-card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .app-tag { margin-top: 0; padding: 4px 10px; color: var(--peach-dark); font-size: 12px; font-weight: 650; }
    .card-arrow { color: var(--text-faint); font-size: 19px; line-height: 1; transition: .2s ease; }
    .app-card:hover .card-arrow { color: var(--accent); transform: translate(2px,-2px); }

    .private-app-card {
      border-color: rgba(74, 109, 222, .24);
      background:
        radial-gradient(circle at 92% 10%, rgba(118, 142, 245, .18), transparent 9rem),
        var(--surface);
    }
    .private-app-card:hover { border-color: rgba(74, 109, 222, .46); }
    .private-app-icon {
      background: linear-gradient(145deg, #eaf0ff, #bdcaff);
      color: #2949a8;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.88), 0 8px 22px rgba(55, 84, 183, .16);
    }
    .private-app-tag { background: #edf1ff; color: #3854b3; }

    footer { border-top: 1px solid var(--border-soft); }
    .footer-inner { max-width: 1120px; min-height: 92px; }

  <script src="./local-auth-bridge.js"></script>
  <script type="module">
    import { loginWithGoogle, logout, subscribeAuth } from "./firebase-auth.js?v=20260725-2";

    const loginBtn = document.getElementById("googleLoginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userProfileBar = document.getElementById("userProfileBar");
    const welcomeUserCard = document.getElementById("welcomeUserCard");

    const userAvatar = document.getElementById("userAvatar");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");

    const heroUserAvatar = document.getElementById("heroUserAvatar");
    const welcomeGreeting = document.getElementById("welcomeGreeting");
    const welcomeEmail = document.getElementById("welcomeEmail");

    loginBtn.addEventListener("click", async () => {
      try {
        loginBtn.style.opacity = "0.7";
        loginBtn.disabled = true;
        const user = await loginWithGoogle();
        if (user) showToast(i18n[currentLang].loginSuccessToast);
      } catch (err) {
        console.error("Google Login Error:", err);
        showToast(i18n[currentLang].loginFailedToast);
      } finally {
        loginBtn.style.opacity = "1";
        loginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await logout();
        showToast(i18n[currentLang].logoutSuccessToast);
      } catch (err) {
        console.error("Logout Error:", err);
      }
    });

    subscribeAuth((user) => {
      if (user) {
        loginBtn.style.display = "none";
        userProfileBar.style.display = "inline-flex";
        welcomeUserCard.style.display = "flex";

        const name = user.displayName || user.email || "User";
        const email = user.email || "";
        const photo = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;

        userAvatar.src = photo;
        userName.textContent = name;
        userEmail.textContent = email;

        heroUserAvatar.src = photo;
        welcomeGreeting.textContent = `${i18n[currentLang].welcomePrefix}${name}! 👋`;
        welcomeEmail.textContent = email;
      } else {
        loginBtn.style.display = "inline-flex";
        userProfileBar.style.display = "none";
        welcomeUserCard.style.display = "none";
      }
    });
  </script>
