# Optional hosting target. This does not create a site, publish, or change DNS.
[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/generated-functions"

[build.environment]
  NODE_VERSION = "22"
  # Root is a static collection; Chordly is exported inside public/Chordly.
  # Prevent auto-detected OpenNext from replacing routes or generating SSR.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "@google-cloud/firestore", "imapflow", "nodemailer", "mailparser", "stripe"]

# Access checks must precede cached files, including every app asset and API.
# Leave cache unset, and do not enable Netlify Split Testing for this site.
[[edge_functions]]
  function = "app-access"
  path = "/*"

[[redirects]]
  from = "/taithai/new"
  to = "/taithai/news/"
  status = 301

[[redirects]]
  from = "/taithai/new/*"
  to = "/taithai/news/:splat"
  status = 301

[[headers]]
  for = "/firebase-auth.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/Chordly/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ACE/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ACE/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/taithai/news/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/membership/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://*.stripe.com; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.stripe.com; frame-src https://accounts.google.com https://*.firebaseapp.com https://*.stripe.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/mail/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://*.stripe.com; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.stripe.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.stripe.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://*.stripe.com; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.stripe.com; frame-src https://accounts.google.com https://*.firebaseapp.com https://*.stripe.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"
