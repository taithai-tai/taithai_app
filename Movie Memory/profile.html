<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movie Memory">
  <link rel="manifest" href="/movie-memory-assets/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/movie-memory-assets/app-icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/movie-memory-assets/app-icons/favicon-32.png">
  <title>โปรไฟล์ — Movie Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link id="preferencesStyles" rel="stylesheet" href="./preferences.css?v=20260728-2">
  <script>
    if (window.location.protocol !== "file:") {
      document.getElementById("preferencesStyles").href = "/movie-memory-assets/preferences.css?v=20260728-2";
    }
    document.write(`<script src="${window.location.protocol === 'file:' ? './' : '/movie-memory-assets/'}preferences.js?v=20260728-1"><\/script>`);
    document.write(`<script src="${window.location.protocol === 'file:' ? './' : '/movie-memory-assets/'}auth-feedback.js?v=20260728-1"><\/script>`);
  </script>
  <style>
    :root{--bg:#0d0a08;--surface:#19130f;--card:#211914;--line:#3b2a1e;--gold:#ffb547;--cream:#f8f1e7;--muted:#a69788}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#3b2115 0,transparent 34%),var(--bg);color:var(--cream);font-family:"Noto Sans Thai",sans-serif;min-height:100vh}
    .shell{width:min(1180px,calc(100% - 36px));margin:auto}header{position:sticky;top:0;z-index:10;border-bottom:1px solid #ffffff12;background:#0d0a08df;backdrop-filter:blur(18px)}
    nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;font:700 19px "Space Grotesk"}
    .logo{width:43px;height:43px;border:1px solid #8a642d;border-radius:14px;display:grid;place-items:center;background:#21160f}.actions{display:flex;align-items:center;gap:10px}
    button,.button{font:600 14px inherit;border-radius:999px;padding:10px 17px;cursor:pointer;text-decoration:none}.primary{border:1px solid var(--gold);background:var(--gold);color:#1c1008}.secondary{border:1px solid var(--line);background:#ffffff0a;color:var(--cream)}
    main{padding:48px 0 80px}.profile-head{display:flex;align-items:center;gap:22px;margin-bottom:32px}.avatar{width:94px;height:94px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--surface)}
    h1{margin:0;font-size:clamp(28px,5vw,48px);line-height:1.15}.handle{color:var(--gold);font-weight:600;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 42px}
    .stat{border:1px solid var(--line);background:#19130fbb;border-radius:18px;padding:18px}.stat strong{display:block;font:700 27px "Space Grotesk";color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-title h2{margin:0;font-size:22px}.section-title span{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}.movie{min-width:0;border:1px solid var(--line);border-radius:19px;overflow:hidden;background:var(--card);box-shadow:0 15px 35px #0005}
    .poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#251d17}.placeholder{aspect-ratio:2/3;display:grid;place-items:center;font-size:48px;background:#251d17}
    .info{padding:14px}.info h3{font-size:15px;line-height:1.35;margin:0 0 7px}.meta{font-size:12px;color:var(--muted)}.stars{color:var(--gold);font-size:12px;margin-top:5px}
    .guest{margin:42px 0 0;padding:26px;border:1px solid #8a642d;background:linear-gradient(135deg,#2c1c11,#17100c);border-radius:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.guest h2{font-size:20px;margin:0 0 5px}.guest p{color:var(--muted);margin:0}
    .empty,.loading{text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:22px;color:var(--muted);grid-column:1/-1}.profile-skeleton{height:220px;border-radius:24px;background:linear-gradient(90deg,#17110d 25%,#241a14 50%,#17110d 75%);background-size:200% 100%;animation:pulse 1.2s infinite}@keyframes pulse{to{background-position:-200% 0}}.error{max-width:560px;margin:80px auto;text-align:center}.error .icon{font-size:58px}
    @media(max-width:650px){
      .shell{width:calc(100% - 20px)}
      nav{min-height:64px;gap:8px}.brand span:last-child{display:none}.logo{width:40px;height:40px}.actions{min-width:0;justify-content:flex-end;gap:7px}
      .actions .button,.actions button{padding:9px 11px;font-size:12px;white-space:nowrap}
      main{padding:28px 0 calc(60px + env(safe-area-inset-bottom))}
      .profile-head{align-items:center;gap:14px;margin-bottom:24px}.avatar{width:70px;height:70px;flex:none}.profile-head h1{font-size:27px;overflow-wrap:anywhere}.handle{font-size:14px}
      .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:18px 0 30px}.stat{padding:12px 8px;text-align:center;border-radius:14px}.stat strong{font-size:22px}.stat span{font-size:10px;line-height:1.3;display:block}
      .section-title h2{font-size:19px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.movie{border-radius:15px}.info{padding:11px}.info h3{font-size:13px}.meta{font-size:10px}.stars{font-size:10px}
      .guest{margin-top:28px;padding:20px;align-items:stretch;flex-direction:column}.guest h2{font-size:18px}.guest .primary{width:100%;min-height:48px}
      .empty,.loading{padding:48px 14px}.error{margin:50px auto}.error h1{font-size:28px}
    }
    @media(max-width:370px){.actions .secondary{font-size:0}.actions .secondary::after{content:"← กลับ";font-size:12px}.stats{grid-template-columns:1fr}.stat{text-align:left}}
    :root{--bg:#000;--surface:rgba(18,18,20,.78);--card:#1c1c1e;--line:rgba(255,255,255,.11);--gold:#ff9f0a;--cream:#f5f5f7;--muted:#98989d}
    body{background:radial-gradient(circle at 50% -20%,rgba(255,159,10,.1),transparent 36rem),linear-gradient(180deg,#070707,#000 46%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Noto Sans Thai",sans-serif;letter-spacing:-.006em}
    header{border-bottom-color:rgba(255,255,255,.09);background:rgba(10,10,11,.72);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px)}
    .brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Noto Sans Thai",sans-serif}.logo{overflow:hidden;border-color:rgba(255,255,255,.14);background:#1c1c1e}.logo img{width:100%;height:100%;display:block;object-fit:cover}
    button,.button{letter-spacing:-.01em}.primary{border-color:transparent;background:var(--gold);color:#000}.secondary{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.075);backdrop-filter:blur(18px)}
    h1{font-weight:720;letter-spacing:-.045em}.avatar{border-color:rgba(255,255,255,.22);box-shadow:0 12px 34px rgba(0,0,0,.32)}
    .stat,.movie,.guest,.empty,.loading{border-color:rgba(255,255,255,.105);background:rgba(28,28,30,.72);box-shadow:inset 0 1px rgba(255,255,255,.035),0 18px 52px rgba(0,0,0,.25);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}
    .stat strong{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}.poster,.placeholder{background:#1c1c1e}
    .profile-skeleton{background:linear-gradient(90deg,#121214 25%,#2c2c2e 50%,#121214 75%);background-size:200% 100%}
  </style>
</head>
<body>
  <header><div class="shell"><nav>
    <a class="brand" href="/Movie%20Memory/"><span class="logo"><img id="profileBrandLogo" src="./assets/feature-icons/brand.jpg?v=20260728-1" alt=""></span><span>Movie Memory</span></a>
    <div class="actions"><a class="button secondary" href="/Movie%20Memory/">← คอลเลกชันของฉัน</a><button id="loginBtn" class="primary" hidden>เข้าสู่ระบบด้วย Google</button></div>
  </nav></div></header>
  <main class="shell">
    <div id="content"><div class="profile-skeleton" aria-label="กำลังเตรียมโปรไฟล์"></div></div>
    <section class="guest" id="guestInvite" hidden>
      <div><h2>เก็บทุกเรื่องที่คุณดูไว้เป็นความทรงจำ 🎬</h2><p>สมัครหรือเข้าสู่ระบบ แล้วเริ่มสร้างคอลเลกชันภาพยนตร์ของคุณเอง</p></div>
      <button class="primary" id="guestLoginBtn">เข้าสู่ระบบด้วย Google</button>
    </section>
  </main>
  <script>
    if (window.location.protocol !== "file:") {
      document.getElementById("profileBrandLogo").src = "/movie-memory-assets/feature-icons/brand.jpg?v=20260728-1";
    }
    window.setTimeout(() => {
      const content = document.getElementById("content");
      if (content?.querySelector(".profile-skeleton")) {
        content.innerHTML = '<div class="error"><div class="icon">🎞️</div><h1>เชื่อมต่อโปรไฟล์ไม่สำเร็จ</h1><p>กรุณากลับไปค้นหาบัญชีอีกครั้ง</p><a class="button primary" href="/Movie%20Memory/">กลับไป Movie Memory</a></div>';
      }
    }, 12000);
  </script>
  <script type="module">
    import { getPublicProfile, getPublicProfileByUsername, loginWithGoogle, subscribeAuth } from "/firebase-auth.js?v=20260728-2";
    const content=document.getElementById("content"),loginBtn=document.getElementById("loginBtn"),guestInvite=document.getElementById("guestInvite");
    const escapeHtml=value=>String(value||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const stars=value=>{const rating=Math.min(5,Math.max(0,Math.round((Number(value)||0)*2)/2)),full=Math.floor(rating),half=rating%1!==0;return"★".repeat(full)+(half?"½":"")+"☆".repeat(5-Math.ceil(rating))};
    const date=value=>{try{return new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"short",year:"numeric"}).format(new Date(value+"T12:00:00"))}catch{return "ไม่ระบุวันที่"}};
    function usernameFromUrl(){
      const query=new URLSearchParams(location.search).get("username");
      const match=decodeURIComponent(location.pathname).match(/\/Movie-Memory\/@([^/]+)/);
      return String(query||match?.[1]||"").replace(/^@/,"");
    }
    function withTimeout(promise, milliseconds=12000){
      return Promise.race([
        promise,
        new Promise((_,reject)=>setTimeout(()=>reject(new Error("LOAD_TIMEOUT")),milliseconds))
      ]);
    }
    async function loadProfile(){
      try{
        const params=new URLSearchParams(location.search);
        const uid=params.get("uid");
        const profileRequest=uid?getPublicProfile(uid):getPublicProfileByUsername(usernameFromUrl());
        const {profile,movies}=await withTimeout(profileRequest);
        const canonicalParams=new URLSearchParams({uid:profile.uid,username:profile.username});
        const canonicalUrl=`/Movie%20Memory/profile?${canonicalParams.toString()}`;
        if(location.pathname+location.search!==canonicalUrl) history.replaceState(null,"",canonicalUrl);
        document.title=`@${profile.username} — Movie Memory`;
        const rated=movies.filter(movie=>Number(movie.rating)>0);
        const average=rated.length?(rated.reduce((sum,movie)=>sum+Number(movie.rating),0)/rated.length).toFixed(1):"—";
        const totalWatches=movies.reduce((sum,movie)=>sum+Math.max(1,Number(movie.watchCount)||0),0);
        content.innerHTML=`
          <section class="profile-head">
            <img class="avatar" src="${escapeHtml(profile.photoURL||`https://api.dicebear.com/7.x/bottts/svg?seed=${profile.uid}`)}" alt="" decoding="async">
            <div><h1>${escapeHtml(profile.displayName||profile.username)}</h1><div class="handle">@${escapeHtml(profile.username)}</div></div>
          </section>
          <section class="stats">
            <div class="stat"><strong>${movies.length}</strong><span>เรื่องที่ดูทั้งหมด</span></div>
            <div class="stat"><strong>${totalWatches}</strong><span>จำนวนครั้งที่รับชม</span></div>
            <div class="stat"><strong>${average}</strong><span>คะแนนเฉลี่ยจาก 5</span></div>
          </section>
          <div class="section-title"><h2>คอลเลกชันภาพยนตร์</h2><span>${movies.length} เรื่อง</span></div>
          <section class="grid">${movies.length?movies.map(movie=>`
            <article class="movie">
              ${movie.posterImg?`<img class="poster" src="${escapeHtml(movie.posterImg)}" alt="${escapeHtml(movie.title)}" loading="lazy" decoding="async">`:`<div class="placeholder">🎬</div>`}
              <div class="info"><h3>${escapeHtml(movie.title||"ไม่มีชื่อหนัง")}</h3><div class="meta">${date(movie.watchDate)} · ดู ${Math.max(1,Number(movie.watchCount)||0)} ครั้ง</div><div class="stars">${stars(movie.rating)}</div></div>
            </article>`).join(""):`<div class="empty">บัญชีนี้ยังไม่มีภาพยนตร์ในคอลเลกชัน</div>`}</section>`;
      }catch(error){
        const timedOut=error?.message==="LOAD_TIMEOUT";
        content.innerHTML=`<div class="error"><div class="icon">🎞️</div><h1>${timedOut?"โหลดข้อมูลไม่สำเร็จ":"ไม่พบโปรไฟล์นี้"}</h1><p>${timedOut?"การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่อีกครั้ง":"ไอดีอาจถูกเปลี่ยน หรือยังไม่ได้สร้างโปรไฟล์"}</p><button class="button primary" id="retryProfileBtn">ลองโหลดอีกครั้ง</button> <a class="button secondary" href="/Movie%20Memory/">กลับ</a></div>`;
        document.getElementById("retryProfileBtn").addEventListener("click",()=>{content.innerHTML='<div class="loading">กำลังโหลดข้อมูลอีกครั้ง...</div>';loadProfile()});
      }
    }
    async function login(){
      const feedback=window.MovieMemoryAuthFeedback;
      try{
        feedback?.show();
        await loginWithGoogle();
        feedback?.setStage("finishing");
        window.setTimeout(()=>{location.href="/Movie%20Memory/"},450);
      }catch(error){
        if(error?.code==="auth/popup-closed-by-user"||error?.code==="auth/cancelled-popup-request") feedback?.hide();
        else feedback?.error();
      }
    }
    loginBtn.addEventListener("click",login);document.getElementById("guestLoginBtn").addEventListener("click",login);
    subscribeAuth(user=>{loginBtn.hidden=Boolean(user);guestInvite.hidden=Boolean(user)});
    loadProfile();
  </script>
</body>
</html>
