<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กำลังนำทาง — Taithai Apps</title><script>
(function(){
  var parts=location.pathname.split('/').filter(Boolean);
  var code=(parts.length===1)?parts[0]:(parts[0]==='S'?parts[1]:'');
  if(/^[a-zA-Z0-9_-]{4,32}$/.test(code||'')){
    location.replace('/?c='+encodeURIComponent(code));
  }else{
    location.replace('/');
  }
})();
</script></head><body><noscript><main><h1>ไม่พบหน้านี้</h1><p><a href="/">กลับไปหน้าแรก Taithai Apps</a></p></main></noscript></body></html>
